<!doctype html>
<html lang="en" class="dark splash-active" style="background:#07090b;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#07090b" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chirpergram" />
    <meta property="og:image" content="/X.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/X.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      /* Startup splash: static markup so it paints before any JS runs. */
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
         background: #07090b;
        width: 100vw; height: 100vh; height: 100dvh;
        opacity: 1; transition: opacity 0.28s ease;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      /* Loading donut: faint track + a bright comet-tail arc that spins. */
      #splash .donut {
        position: relative; width: 56px; height: 56px; border-radius: 50%;
         background: conic-gradient(from 0deg, rgba(30,127,240,0) 0%, rgba(30,127,240,0) 8%, #1e7ff0 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px));
        animation: sp-spin 0.9s linear infinite;
         filter: none;
      }
      #splash .donut::before { /* faint full track behind the arc */
        content: ""; position: absolute; inset: 0; border-radius: 50%;
         box-shadow: inset 0 0 0 5px rgba(255,255,255,0.08);
      }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .donut { animation-duration: 2.4s; }
        #splash { transition: none; }
      }
      html.splash-active, html.splash-active body { overflow: hidden; overscroll-behavior: none; }
    </style>
    <title>Chirpergram — where the world thinks out loud</title>
  </head>
  <body>
    <div id="splash" role="presentation" aria-hidden="true">
      <div class="donut"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
